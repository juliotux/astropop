name: CI (Development Deps)

on:
  push:
    branches:
    - main
    - 'v*'
    tags:
    - '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allowed_failures:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@v1
    if: "!(contains(github.event.head_commit.message, '[skip ci]') || contains(github.event.head_commit.message, '[ci skip]'))"
    with:
      cache-path: ~/.astropy
      cache-key: ${{ github.ref }}-${{ matrix.toxenv }}-astropycache
      libraries: |
        apt:
          - tzdata
          - libopenblas-dev
      envs: |
        - name: (Allowed Failure) Python 3.13 with dev version of deps
          linux: py313-test-devdeps-online
          python-version: '3.13'

        - name: (Allowed Failure) Python 3.14 with dev version of deps
          linux: py314-test-devdeps-online
          python-version: '3.14'

        - macos: py313-test-online
          cache-key: ${{ github.ref }}-py313mac-astropycache

        - windows: py313-test-online
          cache-key: ${{ github.ref }}-py313win-astropycache
