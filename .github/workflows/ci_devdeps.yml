name: CI (Development Deps)

on:
  push:
    branches:
    - main
    - 'v*'
    tags:
    - '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devdeps:
    name: Python ${{ matrix.python }} with development dependencies
    runs-on: ubuntu-24.04
    if: "!(contains(github.event.head_commit.message, '[skip ci]') || contains(github.event.head_commit.message, '[ci skip]'))"
    strategy:
      fail-fast: false
      matrix:
        # Update together when a new Python minor version becomes stable.
        python: ['3.15', '3.16']
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    # uv supplies development Python before setup-python's manifest does.
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install Python
      run: uv python install "${{ matrix.python }}"
    - name: Install build libraries
      run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
    - name: Run offline tests with development dependencies
      # Live services are tested separately by online_conformance.
      run: uv tool run --with pip --with setuptools tox -e py-test-devdeps -- --remote-data=none
