[tox]
envlist =
    py{311,312,313,314,315}-test{,-alldeps}{,-cov}{,-online}
    py311-test-olddeps{,-online}
    py-test-devdeps
    py314-catalogs-online
    build_docs
requires =
    setuptools >= 68.0.0
    pip >= 23.0.0
isolated_build = true

[testenv]
setenv =
    MPLBACKEND=agg
    # Also allow prereleases in isolated build-dependency subprocesses.
    devdeps: PIP_PRE = 1
    PYTEST_ARGS =
    online: PYTEST_ARGS = --remote-data=any

passenv =
    HOME
    WINDIR
    LC_ALL
    LC_CTYPE
    CC
    CI

changedir = .tmp/{envname}

description =
    run tests
    devdeps: with the latest developer version of key dependencies
    olddeps: with the oldest supported version of key dependencies
    cov: and test coverage

# Resolve prereleases before installing Astropop, not as a second upgrade
# after the environment has already selected release-only dependencies.
pip_pre =
    devdeps: true
    !devdeps: false
install_command =
    devdeps: python -I -m pip install --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple {opts} {packages}
    !devdeps: python -I -m pip install {opts} {packages}

deps =
    olddeps: astropy==7.0.0
    olddeps: numpy==2.0.*
    olddeps: scipy==1.13.*
    olddeps: photutils==3.0.*

    build_docs: matplotlib

    devdeps: numpy
    devdeps: scipy
    devdeps: scikit-image
    devdeps: scikit-learn
    devdeps: astropy
    devdeps: git+https://github.com/astropy/astroscrappy.git#egg=astroscrappy
    devdeps: git+https://github.com/astropy/astroquery.git#egg=astroquery
    devdeps: git+https://github.com/astropy/photutils.git#egg=photutils


extras =
    test
    alldeps: all

commands =
    python {toxinidir}/scripts/check_type_annotations.py
    pip freeze
    !cov: pytest --pyargs {toxinidir}/tests {toxinidir}/docs {env:PYTEST_ARGS} {posargs}
    cov: pytest --pyargs {toxinidir}/tests {toxinidir}/docs {env:PYTEST_ARGS} --cov astropop --cov-config={toxinidir}/pyproject.toml {posargs}

[testenv:py314-catalogs-online]
description = check catalog compatibility with live services, including Gaia
commands =
    python {toxinidir}/scripts/check_type_annotations.py
    pip freeze
    pytest --pyargs {toxinidir}/tests/test_catalogs_online.py --remote-data=any {posargs}

[testenv:build_docs]
basepython = python3.14
changedir = docs
description = validate offline examples, canonical pages and strict HTML references
extras =
    docs
    test
commands =
    python {toxinidir}/scripts/check_type_annotations.py
    pip freeze
    python development/check_docs.py --notebooks
    pytest {toxinidir}/docs --remote-data=none
    # Gaia has no offline examples; importing its client requests service status.
    pytest --doctest-modules {toxinidir}/astropop --ignore={toxinidir}/astropop/catalogs/gaia.py --remote-data=none
    python -c "from pathlib import Path; import shutil; path = Path('_build/html'); shutil.rmtree(path) if path.exists() else None"
    sphinx-build -b html -E -a -n -W --keep-going . _build/html
    python development/check_docs.py --html _build/html
    python development/run_tutorials.py --output _build/tutorial_review
